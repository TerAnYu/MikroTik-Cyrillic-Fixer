name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: echo "VERSION=$($env:GITHUB_REF_NAME)" >> $env:GITHUB_OUTPUT

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed `
            --name "MikrotikCyrillicFixer-${{ steps.version.outputs.VERSION }}-win64" `
            --add-data "README.md;." `
            gui_convert.py

      - name: Create ZIP archive
        shell: pwsh
        run: |
          $exeName = "MikrotikCyrillicFixer-${{ steps.version.outputs.VERSION }}-win64"
          Compress-Archive -Path "dist/$exeName.exe", "README.md", "LICENSE" `
            -DestinationPath "$exeName.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win64-build
          path: "*.zip"

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: win64-build

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MikroTik Cyrillic Fixer ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
